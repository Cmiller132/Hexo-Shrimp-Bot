[workspace]
resolver = "3"
members = [
    "crates/hexo-engine",
    "crates/hexo-runner",
    "crates/hexo-player",
    "crates/hexo-search",
    "crates/hexo-records",
    "crates/hexo-model",
    "crates/models/mock",
    "crates/models/mantisnet",
    "crates/hexo-bot",
    # Not a crate of the project: `cargo xtask` defines the verification gates
    # so that CI and a local run cannot disagree about what they are. It is a
    # workspace member so the lint, format, and MSRV gates hold it to the same
    # standard as everything else.
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.85 is the floor for edition 2024 and was declared for that reason alone, but
# it was never true and never checked: `Position::audit` uses a let-chain, which
# is 1.88. Verified, and gated by the `msrv` CI job — a declared MSRV nothing
# tests is worth less than none, because it reads as a promise.
rust-version = "1.88"

[workspace.dependencies]
hexo-engine = { path = "crates/hexo-engine" }
hexo-runner = { path = "crates/hexo-runner" }
hexo-search = { path = "crates/hexo-search" }
hexo-records = { path = "crates/hexo-records" }
hexo-model = { path = "crates/hexo-model" }
hexo-model-mock = { path = "crates/models/mock" }
hexo-model-mantisnet = { path = "crates/models/mantisnet" }
# Container-side crates only (`hexo-model`, `hexo-bot`): manifests and metrics.
# The logic crates stay dependency-free, and the engine stays serde-free by
# design — a position deserialiser is a rule-bypass hole.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The live Torch crossing belongs only to the leaf `hexo-bot` executable. Keep
# PyO3's proc-macro defaults off: the boundary uses its safe embedding API, and
# the workspace forbids unsafe code in its own crates.
pyo3 = { version = "0.26", default-features = false }
# `unsafe_code = "forbid"` rules out hand-rolled signal handlers, so the binary
# takes the one small crate that owns that unsafety.
ctrlc = { version = "3", features = ["termination"] }
# Dev-only: scratch directories for writer, checkpoint, and train-loop tests.
tempfile = "3"

# Lint policy is defined once here; every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# `perf` is the one that earns its keep in a search-heavy engine: needless
# clones, redundant allocations, and iterator misuse on hot paths.
perf = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
