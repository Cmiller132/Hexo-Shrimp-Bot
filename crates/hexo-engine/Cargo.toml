[package]
name = "hexo-engine"
description = "Authoritative Hexo rules and game state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "hexo_engine"
path = "src/lib.rs"
bench = false

[dependencies]

[lints]
workspace = true

[dev-dependencies]
# `cargo_bench_support` is the only feature the suite needs. `plotters` and
# `rayon` are off because the numbers are read from the terminal, and a smaller
# dev tree keeps `cargo bench --no-run` close to a plain `cargo test` build.
criterion = { version = "0.7.0", default-features = false, features = [
    "cargo_bench_support",
] }
proptest = "1"

[[bench]]
name = "engine"
harness = false
