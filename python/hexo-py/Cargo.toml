[package]
name = "hexo-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "hexo_py"
crate-type = ["cdylib"]

[dependencies]
hexo-engine = { path = "../../crates/hexo-engine" }
hexo-model-mantisnet = { path = "../../crates/models/mantisnet" }
hexo-runner = { path = "../../crates/hexo-runner" }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py312"] }
numpy = "0.26"

# Detached from the root cargo workspace on purpose. This Python extension has
# the cdylib-only `extension-module`/abi3 build shape and is built by maturin
# from the Python side. The root workspace's other Python boundary is the
# opposite shape: PyO3 embedding belongs only to the `hexo-bot` binary leaf.
[workspace]
