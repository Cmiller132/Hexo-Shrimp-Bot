[package]
name = "hexo-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "hexo_py"
crate-type = ["cdylib"]

[dependencies]
hexo-engine = { path = "../../crates/hexo-engine" }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py312"] }

# Detached from the root cargo workspace on purpose. The workspace forbids
# unsafe code and stays free of a Python toolchain (CONTAINER_SPEC §4); this
# crate exists exactly to cross that boundary, so it stands alone and is built
# by maturin from the Python side rather than by `cargo xtask verify`.
[workspace]
