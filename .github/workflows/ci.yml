name: CI

# The gates themselves live in `xtask/src/main.rs`, which is the only place
# that spells out a command line or explains why a gate is not redundant. This
# file decides only which runner executes which gate — split into jobs because
# they run in parallel and because `msrv` and `wasm` need their own toolchains.
#
# Adding a gate means adding it to `GATES` with `on_every_push: true` *and*
# giving it a step here. `cargo xtask` with no argument lists the full set.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo xtask fmt
      - run: cargo xtask lint
      - run: cargo xtask lint-release
      - run: cargo xtask test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The floor is read from the workspace manifest here and again inside
      # `cargo xtask msrv`, so bumping `rust-version` moves both at once. This
      # job installs *only* the floor toolchain, which also proves xtask itself
      # builds there.
      - name: Read the declared MSRV
        id: msrv
        run: |
          echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo xtask msrv

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo xtask docs

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo xtask wasm
      - run: cargo xtask wasm-lint
