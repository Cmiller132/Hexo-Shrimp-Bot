name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # The release profile turns `debug_assertions` off, which deletes the only
      # callers of several `pub(crate)` helpers. Without this step the crate can
      # stop compiling warning-free in release while the debug lint stays green.
      - name: Lint (release profile)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # `hexo-engine` is required to stay `wasm32`-compilable, which is what would
  # let a web frontend run the real rules instead of a reimplementation. Nothing
  # in the native build enforces it: a `std::time` call, a threading primitive,
  # or a PyO3 dependency would all compile fine on the host and only fail here.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build (wasm32)
        run: cargo build -p hexo-engine --target wasm32-unknown-unknown

      - name: Lint (wasm32)
        run: cargo clippy -p hexo-engine --target wasm32-unknown-unknown -- -D warnings
