name: Nightly Smoke

# The deep smoke run, which is too slow to gate every push. It catches the
# regressions that only appear over thousands of playouts: a rare board shape,
# a growth-policy edge, a symmetric bug the golden vectors do not happen to
# cover. Nightly, plus on demand.

on:
  schedule:
    # 06:17 UTC, nightly. Off the hour to avoid the top-of-hour scheduling
    # crush on GitHub-hosted runners.
    - cron: "17 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Profile and scale live with the gate definition in `xtask/src/main.rs`,
      # not here. In short: release, because a debug build runs the full
      # tier-C assertion set on every placement, and `HEXO_SMOKE_UNIFORM` is
      # the knob that matters, since full-length uniform games are the
      # expensive case.
      - run: cargo xtask smoke
